<div xmlns:th="http://www.thymeleaf.org" th:fragment="field(label)" data-bank-account-field class="md:col-span-2">
    <label for="settlement-bank-account"
           class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2"
           th:text="${label}">Conta bancária</label>
    <select id="settlement-bank-account" name="bankAccountId" required
            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-900 dark:text-white focus:border-emerald-500 outline-none text-base">
        <option value="">Selecione a conta</option>
        <option th:each="account : ${bankAccounts}" th:value="${account.id}" th:text="${account.name}"></option>
    </select>
    <p th:if="${#lists.isEmpty(bankAccounts)}" class="mt-2 text-xs text-slate-500 dark:text-slate-400">
        Cadastre a conta bancária com seu saldo inicial em
        <a th:if="${@pageAccess.canView('cash-ledger')}" th:href="@{/cash-ledger#contas-bancarias}" class="font-bold underline">Livro Caixa</a><span
            th:unless="${@pageAccess.canView('cash-ledger')}">Livro Caixa</span>.
    </p>
</div>
