<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>


<div th:fragment="modal">
    <style>
        #receiptPreviewModal .rcp-page { padding: 12mm; font-family: 'Inter', Arial, sans-serif; font-size: 10.5px; line-height: 1.45; color: #1e293b; background: #fff; }
        #receiptPreviewModal .rcp-header { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; }
        #receiptPreviewModal .rcp-company { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1 1 260px; }
        #receiptPreviewModal .rcp-logo { width: 110px; height: auto; max-width: 110px; flex: 0 0 auto; }
        #receiptPreviewModal .rcp-company-name { font-size: 13px; font-weight: 800; text-transform: uppercase; color: #0f172a; line-height: 1.15; overflow-wrap: anywhere; }
        #receiptPreviewModal .rcp-company-line { margin-top: 3px; font-size: 9.5px; font-weight: 600; color: #475569; overflow-wrap: anywhere; }
        #receiptPreviewModal .rcp-badge { flex: 0 0 180px; max-width: 100%; background: #0f172a; color: #fff; padding: 13px 18px; border-radius: 16px; }
        #receiptPreviewModal .rcp-badge-label { font-size: 8px; font-weight: 700; letter-spacing: 2px; color: #94a3b8; }
        #receiptPreviewModal .rcp-badge-num { padding: 2px 0; font-size: 25px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
        #receiptPreviewModal .rcp-badge-field { margin-top: 8px; padding-top: 7px; border-top: 1px solid #334155; }
        #receiptPreviewModal .rcp-badge-field span { display: block; font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; }
        #receiptPreviewModal .rcp-badge-field strong { display: block; font-size: 11.5px; font-weight: 800; color: #fff; }
        #receiptPreviewModal .rcp-separator { margin: 18px 0 20px; border-top: 3px solid #0f172a; }
        #receiptPreviewModal .rcp-client { display: flex; margin-bottom: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; overflow: hidden; }
        #receiptPreviewModal .rcp-client-bar { flex: 0 0 4px; background: #0f172a; }
        #receiptPreviewModal .rcp-client-body { flex: 1; min-width: 0; padding: 12px 16px; }
        #receiptPreviewModal .rcp-label { font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #94a3b8; }
        #receiptPreviewModal .rcp-client-name { margin-top: 3px; font-size: 17px; font-weight: 800; color: #0f172a; line-height: 1.15; overflow-wrap: anywhere; }
        #receiptPreviewModal .rcp-client-details { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 9px; padding-top: 7px; border-top: 1px solid #e2e8f0; font-size: 9.5px; font-weight: 600; color: #475569; overflow-wrap: anywhere; }
        #receiptPreviewModal .rcp-wide { flex: 1 1 100%; }
        #receiptPreviewModal .rcp-scroll { width: 100%; overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 14px 14px 0 0; }
        #receiptPreviewModal .rcp-items { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 10.5px; }
        #receiptPreviewModal .rcp-items th { background: #0f172a; color: #fff; font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 9px 10px; text-align: center; }
        #receiptPreviewModal .rcp-items th:nth-child(n+4) { text-align: right; }
        #receiptPreviewModal .rcp-items th.rcp-th-desc { width: 50%; padding-left: 16px; text-align: left; }
        #receiptPreviewModal .rcp-item-title { font-size: 12px; font-weight: 800; color: #0f172a; text-transform: uppercase; letter-spacing: .3px; line-height: 1.25; }
        #receiptPreviewModal .rcp-item-detail { margin-top: 3px; font-size: 9.5px; font-weight: 500; color: #475569; line-height: 1.55; white-space: pre-line; }
        #receiptPreviewModal .rcp-items td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
        #receiptPreviewModal .rcp-items td.rcp-desc { padding-left: 16px; overflow-wrap: anywhere; }
        #receiptPreviewModal .rcp-items td:last-child { padding-right: 16px; }
        #receiptPreviewModal .rcp-center { text-align: center; font-weight: 700; }
        #receiptPreviewModal .rcp-right { text-align: right; }
        #receiptPreviewModal .rcp-muted { color: #64748b; font-weight: 600; }
        #receiptPreviewModal .rcp-strong { font-weight: 700; }
        #receiptPreviewModal .rcp-totals { margin-bottom: 14px; border: 1px solid #e2e8f0; border-top: 0; border-radius: 0 0 14px 14px; overflow: hidden; }
        #receiptPreviewModal .rcp-total-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 16px; }
        #receiptPreviewModal .rcp-total-row > :first-child { font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
        #receiptPreviewModal .rcp-total-row > :last-child { font-size: 14px; font-weight: 700; text-align: right; }
        #receiptPreviewModal .rcp-sub { background: #f8fafc; color: #64748b; }
        #receiptPreviewModal .rcp-disc { background: #fff1f2; color: #be123c; }
        #receiptPreviewModal .rcp-grand { background: #0f172a; color: #cbd5e1; }
        #receiptPreviewModal .rcp-grand > :first-child { font-size: 9.5px; font-weight: 800; }
        #receiptPreviewModal .rcp-grand > :last-child { font-size: 20px; font-weight: 800; color: #fff; }
        #receiptPreviewModal .rcp-section { margin-bottom: 12px; border: 1px solid #e2e8f0; border-radius: 14px; overflow: hidden; }
        #receiptPreviewModal .rcp-section-head { padding: 7px 14px; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; font-size: 8.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: #475569; }
        #receiptPreviewModal .rcp-section-body { padding: 13px 14px; font-size: 10px; font-weight: 500; line-height: 1.6; color: #334155; overflow-wrap: anywhere; }
        #receiptPreviewModal .rcp-statement { font-size: 11px; font-weight: 600; color: #0f172a; }
        #receiptPreviewModal .rcp-photos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        #receiptPreviewModal .rcp-photos img { width: 100%; max-height: 300px; object-fit: contain; border: 1px solid #e2e8f0; border-radius: 6px; background: #f8fafc; }
        #receiptPreviewModal .rcp-signatures { display: flex; gap: 40px; margin-top: 18px; padding-top: 26px; border-top: 2px dashed #cbd5e1; }
        #receiptPreviewModal .rcp-sig { flex: 1 1 0; min-width: 0; text-align: center; }
        #receiptPreviewModal .rcp-sig-image { height: 62px; display: flex; align-items: flex-end; justify-content: center; }
        #receiptPreviewModal .rcp-sig-image img { max-height: 58px; max-width: 175px; }
        #receiptPreviewModal .rcp-sig-line { margin-top: 6px; padding-top: 7px; border-top: 2px solid #0f172a; }
        #receiptPreviewModal .rcp-sig-name { font-size: 11.5px; font-weight: 800; color: #0f172a; overflow-wrap: anywhere; }
        #receiptPreviewModal .rcp-sig-label { margin-top: 2px; font-size: 9.5px; font-weight: 600; color: #64748b; }
        @media (max-width: 640px) {
            #receiptPreviewModal .rcp-page { padding: 16px; }
            #receiptPreviewModal .rcp-badge { flex: 1 1 100%; }
            #receiptPreviewModal .rcp-photos { grid-template-columns: 1fr; }
            #receiptPreviewModal .rcp-signatures { flex-direction: column; gap: 28px; }
        }
    </style>

    <div id="receiptPreviewModal" class="fixed inset-0 z-[70] hidden bg-slate-900/60 backdrop-blur-sm overflow-y-auto" role="dialog" aria-modal="true" aria-label="Pré-visualização do recibo">
        <div class="min-h-full flex items-start justify-center p-2 sm:p-6">
            <div class="w-full max-w-[210mm] bg-white text-slate-800 rounded-2xl shadow-2xl overflow-hidden">
                <div class="sticky top-0 z-10 flex flex-wrap items-center justify-between gap-2 px-3 sm:px-5 py-3 bg-slate-50 border-b border-slate-200">
                    <span class="flex items-center gap-2 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                        <i data-lucide="eye" class="w-4 h-4"></i> Pré-visualização do recibo
                    </span>
                    <div class="flex flex-wrap items-center gap-2">
                        <button type="button" onclick="ReceiptPreview.share()" class="js-receipt-pdf-btn min-h-[44px] px-3 sm:px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm flex items-center justify-center gap-2">
                            <i data-lucide="message-circle" class="w-4 h-4"></i> WhatsApp
                        </button>
                        <button type="button" onclick="ReceiptPreview.print()" class="js-receipt-pdf-btn min-h-[44px] px-3 sm:px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs sm:text-sm flex items-center justify-center gap-2">
                            <i data-lucide="printer" class="w-4 h-4"></i> Imprimir / PDF
                        </button>
                        <button type="button" onclick="ReceiptPreview.close()" aria-label="Fechar pré-visualização" class="min-h-[44px] min-w-[44px] rounded-xl border border-slate-300 bg-white text-slate-600 hover:bg-slate-100 flex items-center justify-center">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
                <div id="receiptPreviewBody"></div>
            </div>
        </div>
    </div>

    <script src="/js/receipt-pdf.js"></script>
    <script src="/js/receipt-preview.js"></script>
</div>

</body>
</html>
